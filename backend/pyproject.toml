# turfturtule backend — project manifest (PEP 621)
# Replaces requirements.txt: this file says what the project IS, not just what to install.

[project]
name = "turfturtule-backend"
version = "0.1.0"
description = "FastAPI backend for Turfturtule"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "asyncpg",
    "python-dotenv",
]

[project.optional-dependencies]
# Install with: pip install -e ".[dev]"
dev = [
    "httpx",        # AsyncClient-based endpoint testing
    "pytest",
    "pytest-asyncio",
    "ruff",         # linter + formatter (config lives in this file too)
]

# Build system: setuptools keeps this workable with plain pip.
# If you adopt `uv` later, replace with: [build-system] requires = ["uv_build>=0.4"] ...
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Our top-level packages (flat layout: app/, core/, utils/ sit directly here)
[tool.setuptools]
packages = ["app", "core", "utils"]

# Tool configs live in the SAME manifest — no more scattered ruff.toml / pytest.ini
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]   # errors, pyflakes, isort (import order), pyupgrade

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
